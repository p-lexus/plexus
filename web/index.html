<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plexus Console</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="%234ECDB4" stroke-width="7" stroke-linecap="square"><path d="M12 12 L26 26"/><path d="M38 38 L52 52"/><path d="M52 12 L38 26"/><path d="M26 38 L12 52"/></svg>'>

<style>
/* ── Tokens ────────────────────────────────────────────────
   p-lexus.com's own palette, which is also the box console's. The plugin and
   the box are two halves of one product, and a panel that looked like neither
   was the clearest sign they had been built apart.

   Dark on bare :root, because the brand is dark: the site, the console and
   this are the same product in the same clothes. Light redefines TOKENS ONLY
   — guarded so an explicit dark choice beats a light OS — and nothing below
   this block names a colour. */
:root{
  color-scheme:dark light;
  --ground:#0B1110; --surface:#101816; --surface-2:#16211F; --sunken:#0E1514;
  --ink:#DCE5E2; --ink-2:#A7B8B3; --muted:#8A9C97; --line:#1E2B28; --line-2:#26332F;
  --accent:#4ECDB4; --accent-ink:#06231D; --accent-soft:#12302B;
  /* Status is fixed and never themed, and always carries a word beside it:
     these four are the box console's, so one state has one colour in both. */
  --ok:#0CA30C; --ok-soft:#0C2416;
  --run:#FAB219; --run-soft:#2C2413;
  --err:#D03B3B; --err-soft:#2E1717;
  --hold:#5598E7; --hold-soft:#122234;
  --field:#0E1514;
  --code:#CFE0DC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.7);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ground:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --sunken:#0E1514;
    --ink:#0F1A18; --ink-2:#3B4A47; --muted:#6B7C78; --line:#DDE5E2; --line-2:#C9D5D1;
    --accent:#14806C; --accent-ink:#FFFFFF; --accent-soft:#DFF2EE;
    --ok:#0A7D0A; --ok-soft:#E1F2E1;
    --run:#8A5B06; --run-soft:#FBEEDC;
    --err:#B42318; --err-soft:#FBE4E2;
    --hold:#2C5FA8; --hold-soft:#E4ECF8;
    --field:#F7FAF9;
    --code:#CFE0DC;
    --shadow:0 1px 2px rgba(15,30,36,.06), 0 8px 24px -12px rgba(15,30,36,.18);
  }
}
:root[data-theme="light"]{
  --ground:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EFED; --sunken:#0E1514;
  --ink:#0F1A18; --ink-2:#3B4A47; --muted:#6B7C78; --line:#DDE5E2; --line-2:#C9D5D1;
  --accent:#14806C; --accent-ink:#FFFFFF; --accent-soft:#DFF2EE;
  --ok:#0A7D0A; --ok-soft:#E1F2E1;
  --run:#8A5B06; --run-soft:#FBEEDC;
  --err:#B42318; --err-soft:#FBE4E2;
  --hold:#2C5FA8; --hold-soft:#E4ECF8;
  --field:#F7FAF9;
  --code:#CFE0DC;
  --shadow:0 1px 2px rgba(15,30,36,.06), 0 8px 24px -12px rgba(15,30,36,.18);
}

/* One radius and one control height, the console's: square-ish, like the mark. */
:root{ --r:6px; --r-sm:4px; --control:32px; }

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:13.5px; line-height:1.5;
  /* No webfont: this panel is served locally and must work offline, so a CDN
     face would risk a silent fallback. The mono stack carries the identity. */
}
:root{--mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
code,kbd,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── Chrome ── */
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--line); display:flex; align-items:center;
  gap:20px; padding:0 24px; flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:9px;padding:12px 0;margin-right:2px}
.brand .mark{color:var(--accent);flex:none}
.brand .word{color:var(--ink);width:auto;flex:none}
.brand span{font-family:var(--mono);font-size:11px;color:var(--muted);padding-left:3px}
nav{display:flex;gap:1px;flex:1;min-width:200px}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  font:inherit;font-size:13px;font-weight:550;padding:15px 12px 13px;cursor:pointer;
}
nav button:hover{color:var(--ink)}
nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.chrome-right{display:flex;align-items:center;gap:14px;padding:8px 0}

/* Live link state: a signal meter, not a dot — bars animate only while
   messages are actually arriving, so "connected but idle" reads differently
   from "connected and busy". */
.link{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.meter{display:flex;align-items:flex-end;gap:2px;height:14px}
.meter i{width:3px;background:var(--line-2);border-radius:1px;height:35%}
.meter i:nth-child(2){height:65%}
.meter i:nth-child(3){height:100%}
.link.up .meter i{background:var(--ok)}
.link.down .meter i{background:var(--err);height:35%}
.link.rx .meter i{animation:pulse .9s ease-in-out infinite}
.link.rx .meter i:nth-child(2){animation-delay:.12s}
.link.rx .meter i:nth-child(3){animation-delay:.24s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.icon-btn{
  display:inline-flex;align-items:center;height:26px;background:none;
  border:1px solid var(--line);border-radius:var(--r-sm);color:var(--muted);
  cursor:pointer;font:inherit;font-size:12px;line-height:1;padding:0 9px;
}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}

main{max-width:1500px;margin:0 auto;padding:24px 24px 64px}

/* ── Structure ── */
.eyebrow{
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);
}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;padding:6px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-b{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Stat tiles: label above, figure dominant, context beneath. */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.tile{background:var(--surface);padding:13px 15px 14px;display:flex;flex-direction:column;gap:3px}
.tile .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.4px;line-height:1.15}
.tile .c{font-size:11.5px;color:var(--muted)}
.tile .v.ok{color:var(--ok)} .tile .v.err{color:var(--err)} .tile .v.run{color:var(--run)}

/* ── Jobs ── */
.job{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.job+.job{margin-top:9px}
.job-h{display:grid;grid-template-columns:3px 1fr auto;align-items:stretch;gap:0}
.stripe{background:var(--line-2)}
.job.s-done .stripe{background:var(--ok)}
.job.s-run  .stripe{background:var(--run)}
.job.s-err  .stripe{background:var(--err)}
.job.s-hold .stripe{background:var(--hold)}
.job-main{padding:11px 14px;min-width:0}
.job-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.jid{font-family:var(--mono);font-size:13px;font-weight:600}
.job-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;font-size:11.5px;color:var(--muted)}
.job-meta .sep{color:var(--line-2)}
.job-act{display:flex;align-items:center;gap:7px;padding:11px 12px}

.chip{
  display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-sm);padding:2.5px 8px;
  font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;white-space:nowrap;
}
.chip.done{background:var(--ok-soft);color:var(--ok)}
.chip.run{background:var(--run-soft);color:var(--run)}
.chip.err{background:var(--err-soft);color:var(--err)}
.chip.hold{background:var(--hold-soft);color:var(--hold)}
.chip.plain{background:var(--surface-2);color:var(--ink-2)}
.chip.mono{background:var(--surface-2);color:var(--ink-2);text-transform:none;font-family:var(--mono)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}

/* Timeline — the milestone history, previously discarded by the bridge. */
.job-body{border-top:1px solid var(--line);padding:14px;display:grid;gap:14px;background:var(--surface-2)}
.tl{display:flex;flex-direction:column;gap:0;position:relative}
.tl-i{display:grid;grid-template-columns:11px 1fr;gap:10px;padding:0 0 11px;position:relative}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:5px;top:12px;bottom:0;width:1px;background:var(--line-2)}
.tl-i:last-child::before{display:none}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--line-2);margin-top:4px;z-index:1;border:2px solid var(--surface-2)}
.tl-i.mark .tl-dot{background:var(--accent)}
.tl-i.bad .tl-dot{background:var(--err)}
.tl-i.warn .tl-dot{background:var(--run)}
.tl-t{font-family:var(--mono);font-size:12px;font-weight:600}
.tl-n{font-size:12px;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
.tl-ts{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}

pre.payload{
  background:var(--sunken);color:var(--code);font-family:var(--mono);font-size:11.5px;
  line-height:1.55;padding:12px 13px;border-radius:var(--r-sm);overflow-x:auto;max-height:340px;
  overflow-y:auto;white-space:pre;
}
.topic{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:7px 9px;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  overflow-x:auto;
}
.topic b{color:var(--accent);font-weight:600}


/* ── Table ─────────────────────────────────────────────────────────────────
   The box console's table, rule for rule. A job in the panel and a job in the
   console should not be two different objects to read: same columns, same
   uppercase heads, same 38px rows, same right-aligned tabular numbers, same
   expandable detail row underneath. */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{
  text-align:left;font-size:10.5px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);padding:8px 12px;background:var(--surface-2);
  border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl td{padding:0 12px;height:38px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl .num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .right,.tbl th.right{text-align:right}
.tbl .nowrap{white-space:nowrap}
.tbl .dim{color:var(--ink-2)}
.tbl .mono{font-family:var(--mono);font-size:12.5px}
.tbl .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12.5px}
.tbl tr.clickable{cursor:pointer}
.tbl tr.open>td{background:var(--surface-2)}
.tbl tr.detail>td{background:var(--ground);height:auto;padding:16px}
.tbl tr.detail:hover>td{background:var(--ground)}
.tbl .cell-actions{display:flex;gap:8px;justify-content:flex-end}
.panes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.panes h4{
  margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--muted);font-weight:500;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.dot.done{background:var(--ok)}
.dot.run{background:var(--accent)}
.dot.err{background:var(--err)}
.dot.hold{background:var(--hold)}
.state{font-size:11.5px;color:var(--muted);white-space:nowrap}
.state.good{color:var(--ok)}
.state.bad{color:var(--err)}
.state.warn{color:var(--run)}
.count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
pre.code.wrap{white-space:pre-wrap;overflow-wrap:anywhere}
pre.code{
  margin:0;background:var(--sunken);color:var(--code);border:1px solid var(--line);
  border-radius:var(--r-sm);padding:12px;font-family:var(--mono);font-size:11.5px;
  line-height:1.55;overflow:auto;max-height:240px;white-space:pre;
}
/* The console's timeline: time, milestone, note — one line each, so a long
   history stays scannable. The type carries the colour; nothing is colour alone. */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:240px;overflow:auto}
.timeline li{display:flex;gap:8px;align-items:baseline;font-size:12.5px}
.timeline .t{color:var(--muted);font-family:var(--mono);font-size:11.5px;flex:none}
.timeline .n{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Forms ── */
label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
input,select,textarea{
  width:100%;height:var(--control);background:var(--field);color:var(--ink);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;
  font:inherit;font-size:13px;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
input.mono,textarea{font-family:var(--mono);font-size:12.5px}
textarea{height:auto;min-height:132px;padding:8px 10px;resize:vertical;line-height:1.55}
input::placeholder,textarea::placeholder{color:var(--muted)}
.field+.field{margin-top:13px}
button.btn{
  display:inline-flex;align-items:center;justify-content:center;height:var(--control);
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:var(--r-sm);padding:0 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
}
button.btn:hover{filter:brightness(1.08)}
button.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
button.btn.quiet{background:var(--field);color:var(--ink);border-color:var(--line)}
button.btn.quiet:hover{color:var(--ink);filter:none;border-color:var(--muted)}
button.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
button.btn.small{height:26px;padding:0 9px;font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input{width:auto;flex:1;min-width:150px}
.filters select{width:auto}

.cap{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface)}
.cap+.cap{margin-top:9px}
.cap-n{font-family:var(--mono);font-size:13.5px;font-weight:650;color:var(--accent)}
.cap-d{font-size:12.5px;color:var(--ink-2);margin:5px 0 9px;max-width:68ch}
details summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:550}
details summary:hover{color:var(--ink-2)}
details[open] summary{margin-bottom:8px}

.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-size:13.5px;margin-bottom:3px}
.note{font-size:12px;color:var(--muted);max-width:70ch}
.warn-bar{
  display:flex;gap:9px;align-items:flex-start;background:var(--run-soft);color:var(--run);
  border-radius:var(--r);padding:11px 13px;font-size:12.5px;
}
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--ground);padding:11px 18px;border-radius:var(--r);font-size:13px;z-index:60;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s
}
#toast.on{opacity:1}
.kv{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;font-size:12.5px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{font-family:var(--mono);overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="brand">
    <!-- docs/logo/plexus-mark.svg and plexus-wordmark.svg, verbatim: the
         same files the site and the box console draw, inlined rather than
         linked so they inherit `color` and so the panel keeps its identity
         offline — this is served by the gateway, never from a CDN. -->
    <svg class="mark" width="19" height="19" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"
         stroke="currentColor" stroke-width="7" stroke-linecap="square">
      <path d="M12 12 L26 26"/>
      <path d="M38 38 L52 52"/>
      <path d="M52 12 L38 26"/>
      <path d="M26 38 L12 52"/>
    </svg>
    <svg class="word" height="15" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-labelledby="title desc">
      <title id="title">PLEXUS</title>
      <desc id="desc">Custom geometric PLEXUS wordmark with a disconnected E and intersecting X.</desc>
    
      <!--
        PLEXUS — Intersection Typo
        Single-colour production SVG.
        Change the logo colour by setting CSS `color`.
      -->
      <g fill="none"
         stroke="currentColor"
         stroke-width="10"
         stroke-linecap="square"
         stroke-linejoin="miter">
    
        <!-- P -->
        <path d="M28 94V26H62C77 26 86 34 86 47C86 60 77 68 62 68H28"/>
    
        <!-- L -->
        <path d="M118 26V94H166"/>
    
        <!-- E — intentionally disconnected -->
        <path d="M198 26H248"/>
        <path d="M198 60H239"/>
        <path d="M198 94H248"/>
    
        <!-- X — crossing paths / protocol intersection -->
        <path d="M282 26L338 94"/>
        <path d="M338 26L282 94"/>
    
        <!-- U -->
        <path d="M372 26V70C372 87 381 96 398 96C415 96 424 87 424 70V26"/>
    
        <!-- S -->
        <path d="M508 26H474C460 26 452 34 452 45C452 56 460 61 474 61H492C506 61 514 68 514 79C514 89 506 94 492 94H452"/>
      </g>
    </svg>
    <span id="agentTag">—</span>
  </div>
  <nav id="nav"></nav>
  <div class="chrome-right">
    <div class="link" id="link"><span class="meter"><i></i><i></i><i></i></span><span id="linkTxt">connecting</span></div>
    <button class="icon-btn" id="themeBtn" title="Switch theme">Theme</button>
    <button class="icon-btn" id="signOut" title="Forget the token on this browser" hidden>Sign out</button>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const API = location.pathname.startsWith('/mqtt-bridge') ? '/mqtt-bridge/ui/api' : '/api';
/* Token handling.
   A token in the query string is accepted once, stored, then stripped from the
   URL — leaving it there would persist a credential in browser history, in the
   address bar, and in any screenshot of this page. Afterwards the bare URL
   works. */
let TOKEN = '';
try { TOKEN = localStorage.getItem('mesh-token') || ''; } catch {}
(() => {
  const fromUrl = new URLSearchParams(location.search).get('token');
  if (!fromUrl) return;
  TOKEN = fromUrl;
  try { localStorage.setItem('mesh-token', TOKEN); } catch {}
  const clean = location.pathname + location.hash;
  history.replaceState(null, '', clean);
})();
const q = (p) => TOKEN ? `${p}${p.includes('?') ? '&' : '?'}token=${encodeURIComponent(TOKEN)}` : p;
function signOut() { TOKEN = ''; try { localStorage.removeItem('mesh-token'); } catch {} location.reload(); }

let profile = null, status = null, jobs = { active: [], history: [] };
let page = 'overview';
let filter = { text: '', state: 'all' };
const open = new Set();          // expanded job ids

const PAGES = [
  ['overview', 'Overview'],
  ['jobs', 'Jobs'],
  ['run', 'Run a job'],
  ['services', 'Services'],
  ['session', 'Session'],
  ['vars', 'Variables'],
];

/* ── helpers ── */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2600); };

function dur(ms) {
  if (!(ms > 0)) return '—';
  const s = Math.round(ms / 1000);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm ' + String(s % 60).padStart(2, '0') + 's';
  return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
}
const clock = (ts) => ts ? new Date(ts).toLocaleTimeString([], { hour12: false }) : '';
const ago = (ts) => ts ? dur(Date.now() - ts) + ' ago' : '—';

// One vocabulary for state, used by stripe, chip and tile alike.
/* Reconnects in the last hour, not since boot. A lifetime counter beside a
   live uptime reads as alarming long after the trouble has passed. */
const recentRc = () => status?.reconnectsLastHour ?? 0;

const RUNNING = new Set(['accepted', 'started']);
const BAD = new Set(['error', 'timeout', 'rejected']);
function tone(state) {
  if (state === 'done') return 'done';
  if (RUNNING.has(state)) return 'run';
  if (BAD.has(state)) return 'err';
  return 'hold';                      // cancelled, duplicate
}
const isRunning = (j) => RUNNING.has(j.state);

function copy(text, what) {
  navigator.clipboard?.writeText(text).then(
    () => toast(`Copied ${what}`),
    () => toast('Copy blocked by the browser'));
}

/* ── data ── */
let needsAuth = false;
async function getJSON(p) {
  const r = await fetch(q(API + p));
  if (r.status === 401) { needsAuth = true; throw new Error('401'); }
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
async function post(p, body) {
  const r = await fetch(q(API + p), {
    method: 'POST',
    // X-Mesh-Panel proves this came from the panel: a hostile page cannot set
    // a custom header cross-origin without a preflight the bridge never allows.
    headers: Object.assign({ 'Content-Type': 'application/json', 'X-Mesh-Panel': '1' },
                           TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}),
    body: JSON.stringify(body),
  });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}
async function loadAll() {
  try {
    needsAuth = false;
    [profile, status, jobs] = await Promise.all([getJSON('/profile'), getJSON('/status'), getJSON('/jobs')]);
    setLink(status.connected);
    render();
  } catch {
    if (needsAuth) { enterSignIn(); return; }
    setLink(false, 'api unreachable');
  }
}

/* Unauthenticated: shut down polling and the stream first. Both re-render, and
   a re-render while someone is typing their token wipes the field — which made
   the form impossible to submit. The screen is drawn once and then left alone. */
function enterSignIn() {
  if (poll) { clearInterval(poll); poll = null; }
  if (es) { try { es.close(); } catch {} es = null; }
  if (!$('tok')) renderSignIn();
  else setLink(false, 'not signed in');
}

async function submitToken() {
  const el = $('tok');
  const v = (el?.value || '').trim();
  if (!v) { toast('Paste the token first'); el?.focus(); return; }
  const btn = $('tok-go');
  if (btn) { btn.disabled = true; btn.textContent = 'Checking…'; }
  TOKEN = v;
  await loadAll();
  if (needsAuth) {                      // rejected — say so, keep what was typed
    if (btn) { btn.disabled = false; btn.textContent = 'Sign in'; }
    const bad = $('tok-err');
    if (bad) bad.textContent = 'That token was not accepted. Check web.auth in your plugin config.';
    $('tok')?.focus();
    return;
  }
  try { localStorage.setItem('mesh-token', v); } catch {}
  stream();
  toast('Signed in');
}

function renderSignIn() {
  setLink(false, 'not signed in');
  $('nav').innerHTML = '';
  $('view').innerHTML = `
    <div class="panel" style="max-width:520px;margin:8vh auto 0">
      <div class="panel-h"><span class="eyebrow">Sign in</span></div>
      <div class="panel-b stack">
        <p class="note">${TOKEN ? 'That token was not accepted. It may have been rotated.' :
          'This panel is protected by a token.'} It is the <code>web.auth</code> value in your
          plugin config, under <code>mqtt-bridge → config → web</code>.</p>
        <div class="field"><label for="tok">Panel token</label>
          <input id="tok" type="password" class="mono" autocomplete="current-password"
                 placeholder="paste the token" autofocus>
          <p class="note" id="tok-err" style="margin-top:6px;color:var(--err)"></p></div>
        <div class="rowflex"><button class="btn" id="tok-go">Sign in</button>
          <span class="note">Stored in this browser — you will not need it again on this machine.</span></div>
      </div>
    </div>`;
  $('tok')?.focus();
}

function setLink(up, txt) {
  const el = $('link');
  el.className = 'link ' + (up ? 'up' : 'down');
  $('linkTxt').textContent = txt || (up ? 'connected' : 'offline');
}
let rxTimer = null;
function flashRx() {
  const el = $('link');
  if (!el.classList.contains('up')) return;
  el.classList.add('rx');
  clearTimeout(rxTimer);
  rxTimer = setTimeout(() => el.classList.remove('rx'), 1400);
}

/* ── live stream ── */
let es = null, poll = null;
function stream() {
  if (needsAuth) return;                 // nothing to stream until signed in
  try { es = new EventSource(q(API + '/events')); } catch { return startPoll(); }
  es.addEventListener('status', (e) => {
    status = Object.assign(status || {}, JSON.parse(e.data));
    setLink(status.connected);
    if (page === 'overview' || page === 'session') render();
  });
  es.addEventListener('profile', (e) => { profile = Object.assign(profile || {}, JSON.parse(e.data)); if (page === 'services' || page === 'overview') render(); });
  es.addEventListener('snapshot', (e) => { jobs = JSON.parse(e.data); render(); });
  es.addEventListener('job', (e) => {
    const rec = JSON.parse(e.data);
    jobs.history = jobs.history || [];
    const i = jobs.history.findIndex((j) => j.jobId === rec.jobId);
    if (i >= 0) jobs.history[i] = rec; else jobs.history.unshift(rec);
    flashRx();
    if (page === 'jobs' || page === 'overview') render();
  });
  es.onopen = () => { if (poll) { clearInterval(poll); poll = null; } };
  es.onerror = () => {
    if (es && es.readyState === 2) { es = null; startPoll(); setTimeout(stream, 5000); }
    else setLink(false, 'reconnecting');
  };
}
function startPoll() {
  if (needsAuth || poll) return;         // polling a 401 just clears the form
  poll = setInterval(loadAll, 3000);
  setLink(false, 'polling');
}

/* ── views ── */
function render() {
  $('agentTag').textContent = status ? `${status.agentId} · ${status.meshRoot}` : '—';
  $('signOut').hidden = !TOKEN;
  $('nav').innerHTML = PAGES.map(([k, label]) =>
    `<button data-p="${k}" aria-current="${page === k}">${label}</button>`).join('');
  const v = $('view');
  if (!profile || !status) { v.innerHTML = `<div class="panel"><div class="empty">Connecting to the bridge…</div></div>`; return; }
  v.innerHTML = ({ overview, jobs: jobsView, run: runView, services, session: sessionView, vars: varsView })[page]();
  if (page === 'run') fillArgs();
  if (page === 'vars') loadSecrets();
}

function overview() {
  const h = jobs.history || [];
  const live = h.filter(isRunning);
  const done = h.filter((j) => j.state === 'done');
  const bad = h.filter((j) => BAD.has(j.state));
  const requeued = h.filter((j) => (j.events || []).some((e) => e.type === 'requeued'));
  const durations = done.filter((j) => j.finishedAt && j.createdAt).map((j) => j.finishedAt - j.createdAt);
  const median = durations.length ? durations.slice().sort((a, b) => a - b)[Math.floor(durations.length / 2)] : 0;

  return `
  <div class="stack">
    ${status.connected ? '' : `<div class="warn-bar"><span>⚠</span><div><b>The bridge is not connected to the broker.</b> Jobs published now are queued by the broker and delivered when it reconnects${status.lastError ? ` — last error: ${esc(status.lastError)}` : ''}.</div></div>`}
    ${recentRc() >= 5 ? `<div class="warn-bar"><span>⚠</span><div><b>${recentRc()} reconnects in the last hour.</b> The link to the broker is unstable${status.lastError ? ` — last error: ${esc(status.lastError)}` : ''}. Jobs still queue and deliver, but dispatch stalls while disconnected.</div></div>` : ''}
    ${status.session && status.session.durable === false ? `<div class="warn-bar"><span>⚠</span><div><b>Session durability is degraded.</b> A client id collision forced a new session, so jobs published while this agent is offline will not be queued. Set a distinct <code>broker.clientId</code> and restart.</div></div>` : ''}
    ${requeued.length ? `<div class="warn-bar"><span>⚠</span><div><b>${requeued.length} job${requeued.length > 1 ? 's were' : ' was'} re-dispatched by the watchdog.</b> That means an executor finished without publishing a result. Open the job to see its timeline.</div></div>` : ''}

    <div class="tiles">
      <div class="tile"><span class="eyebrow">Running</span><span class="v ${live.length ? 'run' : ''}">${live.length}</span><span class="c">${live.length ? esc(live[0].jobId) : 'idle'}</span></div>
      <div class="tile"><span class="eyebrow">Completed</span><span class="v ok">${done.length}</span><span class="c">median ${dur(median)}</span></div>
      <div class="tile"><span class="eyebrow">Failed</span><span class="v ${bad.length ? 'err' : ''}">${bad.length}</span><span class="c">${bad.length ? esc(bad[0].state) + ' most recent' : 'none'}</span></div>
      <div class="tile"><span class="eyebrow">Uptime</span><span class="v">${dur(status.uptimeMs)}</span><span class="c">${recentRc()} reconnect${recentRc() === 1 ? '' : 's'} this hour</span></div>
      <div class="tile"><span class="eyebrow">Messages in</span><span class="v">${status.rx}</span><span class="c">${status.tx} published</span></div>
      <div class="tile"><span class="eyebrow">Services</span><span class="v">${(profile.capabilities || []).length}</span><span class="c">protocol ${esc(status.protocolVersion || '—')}</span></div>
    </div>

    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Live activity</span>
        <button class="btn quiet small" data-go="jobs">All jobs</button></div>
      ${h.length ? `
      <div class="tbl-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th style="width:200px">job</th>
              <th>capability</th>
              <th style="width:130px">owner</th>
              <th class="num" style="width:90px">took</th>
              <th style="width:150px">state</th>
              <th class="right" style="width:130px"></th>
            </tr>
          </thead>
          <tbody>${h.slice(0, 6).map(jobRow).join('')}</tbody>
        </table>
      </div>` : emptyJobs()}
    </div>
  </div>`;
}

function emptyJobs() {
  return `<div class="empty"><b>No jobs yet</b>Dispatch one from <em>Run a job</em>, or publish to
    <code>${esc(status.meshRoot)}/commands/${esc(status.agentId)}/invoke</code>.</div>`;
}

function jobsView() {
  let h = (jobs.history || []).slice();
  if (filter.state !== 'all') {
    h = h.filter((j) => filter.state === 'running' ? isRunning(j)
      : filter.state === 'failed' ? BAD.has(j.state) : j.state === filter.state);

          <select id="f-state">
            ${[['all', 'All states'], ['running', 'Running'], ['done', 'Completed'], ['failed', 'Failed'], ['cancelled', 'Cancelled']]
              .map(([v, l]) => `<option value="${v}"${filter.state === v ? ' selected' : ''}>${l}</option>`).join('')}

              <th style="width:130px">owner</th>

/* One job: the row the box console draws, and the same detail underneath it.

function jobRow(j) {

  const expanded = open.has(j.jobId);
  const elapsed = j.finishedAt ? j.finishedAt - j.createdAt : Date.now() - (j.createdAt || Date.now());
  const events = j.events || [];
  const requeues = events.filter((e) => e.type === 'requeued').length;

  return `
  <tr class="clickable${expanded ? ' open' : ''}" data-row-toggle="${esc(j.jobId)}">
    <td class="mono nowrap"><i class="dot ${t}"></i> ${esc(j.jobId)}</td>
    <td class="mono dim">${esc(j.service || 'unknown')}</td>
    <td class="dim">${esc(j.owner || j.requestedBy || 'public')}</td>
    <td class="num dim">${dur(elapsed)}</td>
    <td>
      <span class="state ${t === 'done' ? 'good' : t === 'err' ? 'bad' : t === 'hold' ? 'warn' : ''}">${esc(j.state)}</span>
      ${requeues ? `<span class="state warn" title="Re-dispatched by the watchdog"> ↻${requeues}</span>` : ''}
    </td>
    <td class="right">
      <span class="cell-actions">

  <tr class="detail">
    <td colspan="6">
      <div class="panes">

            <dt>owner</dt><dd class="mono">${esc(j.owner || 'public')}</dd>
            ${j.requestedBy ? `<dt>claimed by</dt><dd class="mono">${esc(j.requestedBy)}</dd>` : ''}
            <dt>started</dt><dd>${esc(clock(j.createdAt))}</dd>
            ${j.depth ? `<dt>depth</dt><dd>${j.depth}${j.rootJobId && j.rootJobId !== j.jobId ? ` of <span class="mono">${esc(j.rootJobId)}</span>` : ''}</dd>` : ''}
          </dl>

               here — only what the executor recorded about it. -->
          <p class="note" style="margin-top:9px">The arguments are not retained: an invoke is not

        </section>

        <section>
          <h4>Timeline</h4>
          ${events.length ? `<ol class="timeline">${events.map(tlItem).join('')}</ol>`
            : `<p class="note">No milestones recorded. The executor publishes these to the events topic as it works.</p>`}
        </section>

        <section>
          <h4>Answer</h4>
          ${verdict ? `<p style="margin:0 0 8px"><span class="chip plain">${esc(verdict)}</span></p>` : ''}
          ${j.result ? `<pre class="code">${esc(JSON.stringify(j.result, null, 2))}</pre>`
            : `<p class="note">Nothing terminal yet.</p>`}
        </section>
      </div>

      <div style="margin-top:16px">
        <h4 style="margin:0 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500">Topics</h4>
        <div class="topic"><b>events</b><span>${esc(topic)}/events</span>
          <button class="btn quiet small" style="margin-left:auto" data-copy="${esc(topic)}/events">Copy</button></div>
        <div class="topic" style="margin-top:6px"><b>result</b><span>${esc(topic)}/result</span>
          <button class="btn quiet small" style="margin-left:auto" data-copy="${esc(topic)}/result">Copy</button></div>
      </div>
    </td>

}

function tlItem(e) {
  const bad = /error|timeout|failed/i.test(e.type);

  return `<li>

function runView() {

/* ── capability editor ──────────────────────────────────────────────────────
   A capability is data, so editing one is a form — not a JSON blob. The editor
   keeps the prompt and its schema honest about each other: placeholders the
   prompt uses must be declared, declared fields should be used, and ${VAR}
   references must actually be bound in this deployment. */
let draft = null;   // null = editor closed

const BLANK = () => ({ service: '', description: '', avgLatency: '', handler: 'session',
                       prompt: '', fields: [], editing: null });

function toFields(schema) {
  return Object.entries(schema || {}).map(([name, spec]) => {
    const t = String(spec);
    const type = t.includes('number') ? 'number' : t.includes('boolean') ? 'boolean' : t.includes('object') ? 'object' : 'string';
    const note = t.replace(/^(string|number|boolean|object)\??\s*/, '').replace(/^\((.*)\)$/, '$1');
    return { name, type, optional: t.includes('?'), note };
  });
}
function fromFields(fields) {
  const out = {};
  for (const f of fields) {
    if (!f.name.trim()) continue;
    out[f.name.trim()] = `${f.type}${f.optional ? '?' : ''}${f.note ? ` (${f.note})` : ''}`;
  }
  return out;
}
const placeholders = (prompt) => [...new Set([...String(prompt).matchAll(/\{\{(\w+)\}\}/g)].map((m) => m[1]))]
  .filter((n) => n !== 'jobId' && n !== 'requestedBy');
const varRefs = (prompt) => [...new Set([...String(prompt).matchAll(/\$\{([A-Za-z_]\w*)\}/g)].map((m) => m[1]))];

function lint(d) {
  const out = [];
  const names = d.fields.map((f) => f.name.trim()).filter(Boolean);
  const used = placeholders(d.prompt);
  for (const u of used) if (!names.includes(u))
    out.push({ bad: true, msg: `The prompt uses {{${u}}} but no argument declares it — Run a job won't offer that field, and it renders empty.` });
  for (const n of names) if (!used.includes(n))
    out.push({ bad: false, msg: `Argument “${n}” is declared but the prompt never uses it.` });
  const bound = (status.promptVars || []);
  for (const v of varRefs(d.prompt)) if (!bound.includes(v))
    out.push({ bad: true, msg: `\${${v}} is not bound. Add it to mesh.promptVars in openclaw.json, or it substitutes empty.` });
  if (d.service && !/^[a-z][a-z0-9]*(\.[a-z0-9]+)*$/.test(d.service.trim()))
    out.push({ bad: false, msg: `Service names are conventionally lowercase and dotted, like “code.review”.` });
  return out;
}

function services() {

/* One capability: the row the box console's catalogue draws — name, who or
   what it takes, what it does — with the prompt underneath when opened. */
function capRow(c) {
  const key = 'svc:' + c.service;
  const expanded = open.has(key);
  const args = Object.keys(c.requestSchema || {});
  const missing = placeholders(c.prompt || '').filter((n) => !(c.requestSchema || {})[n]);
  const unbound = varRefs(c.prompt || '').filter((v) => !(status.promptVars || []).includes(v));

  return `

    <td>
      <span class="rowflex" style="gap:4px">
        ${args.map((k) => `<span class="chip mono">${esc(k)}</span>`).join('') || '<span class="note">none</span>'}
      </span>
    </td>
    <td class="dim"><span class="desc">${esc(c.description || '—')}</span></td>
    <td class="right">
      <span class="cell-actions">
        ${missing.length ? `<span class="chip err" title="Prompt uses {{${esc(missing.join(', '))}}} with no matching argument">${missing.length} undeclared</span>` : ''}
        ${unbound.length ? `<span class="chip err" title="Unbound: ${esc(unbound.join(', '))}">${unbound.length} unbound</span>` : ''}
        <button class="btn quiet small" data-use="${esc(c.service)}">Run</button>
        <button class="btn quiet small" data-edit="${esc(c.service)}">Edit</button>
        <button class="btn danger small" data-del="${esc(c.service)}">Remove</button>
      </span>
    </td>
  </tr>
  ${expanded ? `
  <tr class="detail">
    <td colspan="4">
      <div class="panes">
        <section>
          <h4>Prompt</h4>
          <pre class="code wrap">${esc(c.prompt || '(none)')}</pre>
        </section>
        <section>
          <h4>Arguments</h4>
          ${args.length ? `<dl class="kv">${args.map((k) =>
            `<dt class="mono">${esc(k)}</dt><dd class="note">${esc(String((c.requestSchema || {})[k]))}</dd>`).join('')}</dl>`
            : `<p class="note">This capability takes no arguments.</p>`}
          ${c.avgLatency ? `<p class="note" style="margin-top:9px">typically ${esc(c.avgLatency)}</p>` : ''}
        </section>
      </div>
    </td>
  </tr>` : ''}`;
}

function editor() {
  const d = draft, issues = lint(d);
  return `
  <div class="panel">
    <div class="panel-h"><span class="eyebrow">${d.editing ? 'Edit ' + esc(d.editing) : 'New service'}</span>
      <button class="btn quiet small" data-cancel-edit="1">Cancel</button></div>
    <div class="panel-b">
      <div class="rowflex" style="gap:12px;align-items:flex-start">
        <div class="field" style="flex:2;min-width:190px"><label for="e-name">Name</label>
          <input id="e-name" class="mono" placeholder="db.schema_review" value="${esc(d.service)}"${d.editing ? ' disabled' : ''}>
          ${d.editing ? '<p class="note" style="margin-top:5px">Renaming would orphan callers — remove and re-add instead.</p>' : ''}</div>
        <div class="field" style="flex:1;min-width:120px"><label for="e-lat">Typical time</label>
          <input id="e-lat" placeholder="2-4 min" value="${esc(d.avgLatency)}"></div>
      </div>
      <div class="field"><label for="e-desc">What it does</label>
        <input id="e-desc" placeholder="Review a migration for lock risk and index coverage" value="${esc(d.description)}"></div>

      <div class="field"><label>Arguments</label>
        <p class="note" style="margin:-2px 0 8px">Each becomes a <code>{{name}}</code> the prompt can use, and a field in Run a job.</p>
        ${d.fields.map((f, i) => `
          <div class="rowflex" style="gap:7px;margin-bottom:6px">
            <input class="mono" style="flex:1;min-width:110px" data-f="name" data-i="${i}" placeholder="repo" value="${esc(f.name)}">
            <select style="width:auto" data-f="type" data-i="${i}">
              ${['string', 'number', 'boolean', 'object'].map((t) => `<option${f.type === t ? ' selected' : ''}>${t}</option>`).join('')}
            </select>
            <input style="flex:2;min-width:130px" data-f="note" data-i="${i}" placeholder="owner/name" value="${esc(f.note)}">
            <label style="display:flex;align-items:center;gap:5px;margin:0;font-weight:500;white-space:nowrap">
              <input type="checkbox" style="width:auto" data-f="optional" data-i="${i}"${f.optional ? ' checked' : ''}> optional</label>
            <button class="btn quiet small" data-rmfield="${i}">Remove</button>
          </div>`).join('')}
        <button class="btn quiet small" data-addfield="1">Add argument</button></div>

      <div class="field"><label for="e-prompt">Prompt</label>
        <textarea id="e-prompt" spellcheck="false" placeholder="Review migration {{migration}} in {{repo}}.">${esc(d.prompt)}</textarea>
        <p class="note" style="margin-top:5px"><code>{{name}}</code> comes from the arguments above.
          <code>${'$'}{VAR}</code> comes from <code>mesh.promptVars</code>, resolved on dispatch so deployment
          values never reach the published catalog.
          ${(status.promptVars || []).length ? `Bound here: ${(status.promptVars || []).map((v) => `<code>${'$'}{${esc(v)}}</code>`).join(' ')}` : 'None bound in this deployment.'}</p></div>

      ${issues.length ? `<div class="stack" style="gap:6px;margin-top:12px">
        ${issues.map((i) => `<div class="warn-bar" style="${i.bad ? '' : 'background:var(--surface-2);color:var(--ink-2)'}">
          <span>${i.bad ? '⚠' : 'ⓘ'}</span><div>${esc(i.msg)}</div></div>`).join('')}</div>` : ''}

      <div class="rowflex" style="margin-top:14px">
        <button class="btn" data-save="1"${issues.some((i) => i.bad) ? ' disabled title="Resolve the warnings above first"' : ''}>
          ${d.editing ? 'Save changes' : 'Create service'}</button>
        <span class="note">${d.editing ? 'Republishes the catalog immediately.' : 'Available to the mesh as soon as it is created.'}</span>
      </div>
    </div>
  </div>`;
}

function readEditor() {
  if (!draft) return;
  const g = (id) => $(id)?.value ?? '';
  if (!draft.editing) draft.service = g('e-name');
  draft.avgLatency = g('e-lat');
  draft.description = g('e-desc');
  draft.prompt = g('e-prompt');
}

async function saveDraft() {
  readEditor();
  const d = draft;
  if (!d.service.trim()) return toast('Give the service a name');
  if (!d.prompt.trim()) return toast('A capability needs a prompt — it is what the executor runs');
  const body = {
    service: d.service.trim(), description: d.description.trim(), handler: d.handler,
    prompt: d.prompt, requestSchema: fromFields(d.fields),
    ...(d.avgLatency.trim() ? { avgLatency: d.avgLatency.trim() } : {}),
  };
  const r = d.editing
    ? await post('/config', { action: 'update_service', service: d.editing, patch: body })
    : await post('/config', { action: 'add_service', service: body });
  if (r.ok) { toast((d.editing ? 'Saved ' : 'Created ') + d.service); draft = null; await loadAll(); }
  else toast(r.data.error || 'Could not save it');
}



function sessionView() {
  const s = status.session || {};
  const op = status.ownerPolicy || profile.ownerPolicy || {};
  return `
  <div class="stack">
    ${s.durable === false ? `<div class="warn-bar"><span>⚠</span><div><b>Durability degraded.</b> A client id collision forced a disambiguated session. Jobs published while this agent is offline are no longer queued.</div></div>` : ''}
    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Broker session</span></div>
      <div class="panel-b"><dl class="kv">
        <dt>Client id</dt><dd>${esc(s.clientId || '—')}</dd>
        <dt>Protocol</dt><dd>MQTT ${s.mqttVersion === 5 ? '5' : '3.1.1'} · mesh ${esc(status.protocolVersion || '—')}</dd>
        <dt>Durable session</dt><dd>${s.durable === false ? 'no — jobs lost while offline' : 'yes — offline jobs are queued'}</dd>
        <dt>Keepalive</dt><dd>${esc(s.keepalive || '—')}s</dd>
        <dt>Uptime</dt><dd>${dur(status.uptimeMs)} on this connection</dd>
        <dt>Reconnects</dt><dd>${recentRc()} in the last hour · ${status.reconnects} since start</dd>
        <dt>Last error</dt><dd>${status.lastError ? esc(status.lastError) : 'none'}</dd>
      </dl></div>
    </div>
    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Owner policy</span></div>
      <div class="panel-b">
        <dl class="kv">
          <dt>requestedBy</dt><dd>${op.required ? 'required — unowned jobs are rejected' : 'optional — unowned jobs go to “public”'}</dd>
          <dt>Verified</dt><dd>${op.verified ? 'yes — checked against broker identity' : 'no — self-declared, not authenticated'}</dd>
        </dl>
        ${!op.verified ? `<p class="note" style="margin-top:11px">Owner scoping is a convention here: anyone with broker credentials can claim any owner. Enable <code>mesh.verifyOwner</code> once the broker injects <code>client_username</code>.</p>` : ''}
      </div>
    </div>
    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Subscribe</span></div>
      <div class="panel-b stack" style="gap:6px">
        ${[['your jobs', `${status.meshRoot}/jobs/<your-name>/#`],
           ['results only', `${status.meshRoot}/jobs/<your-name>/+/result`],
           ['dispatch', `${status.meshRoot}/commands/${status.agentId}/invoke`],
           ['catalog', `${status.meshRoot}/registry/${status.agentId}/profile`]]
          .map(([k, t]) => `<div class="topic"><b>${esc(k)}</b><span>${esc(t)}</span>
            <button class="btn quiet small" style="margin-left:auto" data-copy="${esc(t)}">Copy</button></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ── deployment variables ───────────────────────────────────────────────────
   Values are write-only from here: the API returns names, sources and a masked
   hint, never a value. Managing them needs web.auth configured — an open
   loopback endpoint is not somewhere secrets belong. */
let secrets = null;          // null = not loaded, {authRequired} or {vars}
let secretsLoading = false;

/* Guarded, because render() calls this and this calls render(): without the
   guards the Variables tab fetches /api/secrets in an unbounded loop. */
async function loadSecrets(force) {
  if (secretsLoading) return;
  if (secrets && !force) return;
  secretsLoading = true;
  try {
    const r = await fetch(q(API + '/secrets'), { headers: TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {} });
    secrets = await r.json();
  } catch {
    secrets = { error: 'Could not reach the bridge.' };
  }
  secretsLoading = false;
  if (page === 'vars') render();
}

function varsView() {
  const referenced = new Set();
  for (const c of (profile.capabilities || [])) for (const v of varRefs(c.prompt || '')) referenced.add(v);

  if (!secrets) return `<div class="panel"><div class="empty">Loading…</div></div>`;

  if (secrets.authRequired) return `
    <div class="stack">
      <div class="panel">
        <div class="panel-h"><span class="eyebrow">Deployment variables</span></div>
        <div class="panel-b stack">
          <div class="warn-bar"><span>⚠</span><div><b>Managing variables needs a panel token.</b>
            ${esc(secrets.error || '')}</div></div>
          <p class="note">These values are substituted into capability prompts, so anything that can
            write them can change what your agent does. The panel runs open on loopback, which is fine
            for reading job state but not for holding secrets — so this section stays locked until a
            token exists.</p>
          <div><div class="eyebrow" style="margin-bottom:7px">Add to openclaw.json</div>
            <pre class="payload">"mqtt-bridge": {
  "config": {
    "web": { "auth": "<a long random string>" }
  }
}</pre></div>
          <p class="note">Restart the gateway, then open the panel as
            <code>${esc(location.origin)}/?token=&lt;that string&gt;</code>.
            The token also unlocks the SSE stream, which cannot send headers.</p>
          ${referenced.size ? `<p class="note">Prompts currently reference:
            ${[...referenced].map((v) => `<code>${'$'}{${esc(v)}}</code>`).join(' ')}</p>` : ''}
        </div>
      </div>
    </div>`;

  const vars = secrets.vars || [];
  const unbound = [...referenced].filter((v) => !vars.some((x) => x.name === v));

  return `
  <div class="stack">
    ${unbound.length ? `<div class="warn-bar"><span>⚠</span><div>
      <b>${unbound.length} variable${unbound.length > 1 ? 's are' : ' is'} referenced by a prompt but not set.</b>
      They substitute empty at dispatch: ${unbound.map((v) => `<code>${'$'}{${esc(v)}}</code>`).join(' ')}</div></div>` : ''}

    <div class="panel">
      <div class="panel-h"><span class="eyebrow">${vars.length} variable${vars.length === 1 ? '' : 's'}</span>
        <span class="note">Stored in <code>${esc(secrets.file || 'mesh.local.json')}</code>, mode 0600, never committed</span></div>
      <div class="panel-b">
        ${vars.map((v) => `
          <div class="cap">
            <div class="rowflex" style="justify-content:space-between">
              <div class="rowflex" style="gap:9px">
                <span class="cap-n">${'$'}{${esc(v.name)}}</span>
                <span class="chip ${v.source === 'config' ? 'accent' : v.source === 'env' ? 'plain' : 'done'}">${esc(v.source)}</span>
                ${referenced.has(v.name) ? '' : '<span class="chip plain" title="No prompt uses it">unused</span>'}
              </div>
              <div class="rowflex">
                <span class="mono note">${esc(v.hint || 'set')}</span>
                ${v.editable
                  ? `<button class="btn quiet small" data-setvar="${esc(v.name)}">Replace</button>
                     <button class="btn danger small" data-delvar="${esc(v.name)}">Delete</button>`
                  : `<span class="note">pinned in openclaw.json</span>`}
              </div>
            </div>
          </div>`).join('') || `<div class="empty"><b>No variables yet</b>Add one below and reference it from a prompt as <code>${'$'}{NAME}</code>.</div>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Set a variable</span></div>
      <div class="panel-b">
        <div class="rowflex" style="gap:12px;align-items:flex-start">
          <div class="field" style="flex:1;min-width:190px"><label for="s-name">Name</label>
            <input id="s-name" class="mono" placeholder="SLACK_REVIEW_RECIPIENTS" value="${esc(unbound[0] || '')}"></div>
          <div class="field" style="flex:2;min-width:210px"><label for="s-val">Value</label>
            <input id="s-val" type="password" autocomplete="new-password" placeholder="value is write-only"></div>
        </div>
        <div class="rowflex" style="margin-top:12px">
          <button class="btn" data-savevar="1">Save variable</button>
          <span class="note">Takes effect on the next job — no restart. Setting an existing name replaces it.</span>
        </div>
      </div>
    </div>
  </div>`;
}

async function saveVar(name, value, remove) {
  const r = await post('/secrets', remove ? { name, delete: true } : { name, value });
  if (r.ok) { toast(remove ? `Removed ${name}` : `Saved ${name}`); await loadSecrets(true); await loadAll(); }
  else toast(r.data.error || 'Could not save it');
}

/* ── actions ── */
function sampleArgs(cap) {
  const out = {};
  for (const [k, v] of Object.entries(cap.requestSchema || {})) {
    const t = String(v), optional = t.includes('?');
    if (optional) continue;                       // keep the starting payload minimal
    out[k] = t.includes('number') ? 0 : t.includes('boolean') ? false : '';
  }
  return out;
}
function fillArgs() {
  const cap = (profile.capabilities || []).find((c) => c.service === $('r-svc')?.value);
  if (cap && $('r-args')) $('r-args').value = JSON.stringify(sampleArgs(cap), null, 2);
}
async function dispatch() {
  let args;
  try { args = JSON.parse($('r-args').value || '{}'); }
  catch { $('r-out').textContent = 'Arguments must be valid JSON.'; return; }
  const by = $('r-by').value.trim();
  if (!by) { $('r-out').textContent = 'Requested by is required — it scopes the job to you.'; return; }
  const btn = $('r-go'); btn.disabled = true; btn.textContent = 'Dispatching…';
  const r = await post('/invoke', { service: $('r-svc').value, args, requestedBy: by });
  btn.disabled = false; btn.textContent = 'Dispatch';
  if (r.ok) { toast('Dispatched ' + r.data.jobId); open.add(r.data.jobId); page = 'jobs'; await loadAll(); }
  else $('r-out').textContent = r.data.error || 'Dispatch failed.';
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-row-toggle]'); if (!t) return;
  const d = t.dataset;
  if (d.p) { page = d.p; render(); }
  else if (d.rowToggle) { open.has(d.rowToggle) ? open.delete(d.rowToggle) : open.add(d.rowToggle); render(); }
  else if (d.go) { page = d.go; render(); }
  else if (d.toggle) { open.has(d.toggle) ? open.delete(d.toggle) : open.add(d.toggle); render(); }
  else if (d.copy) copy(d.copy, 'topic');
  else if (d.cancel) {
    if (!confirm(`Cancel ${d.cancel}?\n\nThe mesh publishes a terminal result immediately and ignores anything the executor sends afterwards. Work already running may still finish internally.`)) return;
    const r = await post('/cancel', { jobId: d.cancel, requestedBy: 'web-ui' });
    toast(r.ok ? 'Cancelled ' + d.cancel : 'That job is no longer active');
    loadAll();
  }
  else if (d.use) { page = 'run'; render(); const s = $('r-svc'); if (s) { s.value = d.use; fillArgs(); } }
  else if (d.new) { draft = BLANK(); render(); $('e-name')?.focus(); }
  else if (d.edit) {
    const c = (profile.capabilities || []).find((x) => x.service === d.edit);
    if (c) { draft = { service: c.service, description: c.description || '', avgLatency: c.avgLatency || '',
                       handler: c.handler || 'session', prompt: c.prompt || '',
                       fields: toFields(c.requestSchema), editing: c.service }; render(); }
  }
  else if (d.cancelEdit) { draft = null; render(); }
  else if (d.addfield) { readEditor(); draft.fields.push({ name: '', type: 'string', optional: false, note: '' }); render(); }
  else if (d.rmfield) { readEditor(); draft.fields.splice(Number(d.rmfield), 1); render(); }
  else if (d.save) saveDraft();
  else if (d.del) {
    if (!confirm(`Remove ${d.del}?\n\nIt disappears from the published catalog immediately.`)) return;
    const r = await post('/config', { action: 'remove_service', service: d.del });
    toast(r.ok ? 'Removed ' + d.del : (r.data.error || 'Could not remove it'));
    loadAll();
  }
  else if (d.savevar) {
    const n = $('s-name').value.trim(), v = $('s-val').value;
    if (!n) return toast('Name the variable');
    if (!v) return toast('Give it a value');
    saveVar(n, v, false);
  }
  else if (d.setvar) { const el = $('s-name'); if (el) { el.value = d.setvar; $('s-val').value = ''; $('s-val').focus(); } }
  else if (d.delvar) {
    if (!confirm(`Delete ${d.delvar}?\n\nPrompts referencing it will substitute empty on the next job.`)) return;
    saveVar(d.delvar, '', true);
  }
  else if (t.id === 'tok-go') submitToken();
  else if (t.id === 'signOut') signOut();
  else if (t.id === 'r-go') dispatch();
  else if (t.id === 'themeBtn') {
    const now = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const next = now === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mesh-theme', next); } catch {}
  }
});

// Re-rendering on every keystroke would steal the caret, so restore it. Only
// the prompt and the argument rows re-render live — they drive the linter.
function keepCaret(id, fn) {
  const el = $(id), pos = el?.selectionStart;
  fn();
  const next = $(id);
  if (next) { next.focus(); if (pos != null && next.setSelectionRange) try { next.setSelectionRange(pos, pos); } catch {} }
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'f-text') { filter.text = t.value; keepCaret('f-text', render); return; }
  if (t.id === 'f-state') { filter.state = t.value; render(); return; }
  if (t.id === 'r-svc') { fillArgs(); return; }
  if (!draft) return;
  if (t.id === 'e-prompt') { draft.prompt = t.value; keepCaret('e-prompt', render); return; }
  if (t.dataset.f) {
    const f = draft.fields[Number(t.dataset.i)];
    if (!f) return;
    f[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.f === 'name') {
      const sel = `[data-f="name"][data-i="${t.dataset.i}"]`;
      const pos = t.selectionStart; render();
      const n = document.querySelector(sel);
      if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
    } else if (t.dataset.f === 'optional' || t.dataset.f === 'type') render();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'tok') { e.preventDefault(); submitToken(); return; }
  if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); page = 'jobs'; render(); $('f-text')?.focus();
  }
});

try { const saved = localStorage.getItem('mesh-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch {}
loadAll().then(stream);
setInterval(() => {
  if (needsAuth || !profile || !status) return;       // never redraw over the sign-in form
  if (page === 'overview' || page === 'jobs') render();
}, 15000);                                            // keeps relative times honest
</script>
</body>
</html>
