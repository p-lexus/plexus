<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 471" width="1160" height="471" role="img" aria-label="Two Plexus agents collaborating on one request, with Hermes delivering the outcome">
  <style>
    :root{--bg:#0f1518;--fg:#c9d6d3;--dim:#6d8078;--teal:#3fb9a5;--amber:#d8a44b;--red:#e26d6d;--green:#5fbf8a;--chrome:#1b2427}
    @media (prefers-color-scheme: light){
      :root{--bg:#f6f8f7;--fg:#22312e;--dim:#7d8f89;--teal:#12796a;--amber:#9a6b12;--red:#b23b3b;--green:#2f7d55;--chrome:#e5eae8}
    }
    .bg{fill:var(--bg)}
    .chrome{fill:var(--chrome)}
    text{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13.25px;fill:var(--fg);white-space:pre}
    .d{fill:var(--dim)}
    .b{font-weight:700}
    .teal{fill:var(--teal)}
    .amber{fill:var(--amber)}
    .red{fill:var(--red)}
    .green{fill:var(--green)}
    /* Base state is VISIBLE, and the animation hides lines before revealing
       them. If animations never run — a paused tab, a renderer that does not
       animate images, a reduced-motion setting — the reader still gets the
       whole transcript. The opposite default fails to a blank terminal, which
       reads as broken rather than as an animation that has not started. */
    .l{opacity:1;animation-duration:5.91s;animation-iteration-count:infinite;animation-timing-function:steps(1,end)}
    @media (prefers-reduced-motion: reduce){.l{opacity:1;animation:none}}
    @keyframes r0{0%,9%{opacity:1}9.40%,10.20%{opacity:0}10.55%,100%{opacity:1}}
    @keyframes r1{0%,9%{opacity:1}9.40%,10.20%{opacity:0}10.55%,100%{opacity:1}}
    @keyframes r2{0%,9%{opacity:1}9.40%,10.20%{opacity:0}10.55%,100%{opacity:1}}
    @keyframes r3{0%,9%{opacity:1}9.40%,10.20%{opacity:0}10.55%,100%{opacity:1}}
    @keyframes r4{0%,9%{opacity:1}9.40%,15.09%{opacity:0}15.44%,100%{opacity:1}}
    @keyframes r5{0%,9%{opacity:1}9.40%,16.95%{opacity:0}17.30%,100%{opacity:1}}
    @keyframes r6{0%,9%{opacity:1}9.40%,18.82%{opacity:0}19.17%,100%{opacity:1}}
    @keyframes r7{0%,9%{opacity:1}9.40%,23.91%{opacity:0}24.26%,100%{opacity:1}}
    @keyframes r8{0%,9%{opacity:1}9.40%,25.77%{opacity:0}26.12%,100%{opacity:1}}
    @keyframes r9{0%,9%{opacity:1}9.40%,32.62%{opacity:0}32.97%,100%{opacity:1}}
    @keyframes r10{0%,9%{opacity:1}9.40%,34.48%{opacity:0}34.83%,100%{opacity:1}}
    @keyframes r11{0%,9%{opacity:1}9.40%,36.35%{opacity:0}36.70%,100%{opacity:1}}
    @keyframes r12{0%,9%{opacity:1}9.40%,38.21%{opacity:0}38.56%,100%{opacity:1}}
    @keyframes r13{0%,9%{opacity:1}9.40%,40.07%{opacity:0}40.42%,100%{opacity:1}}
    @keyframes r14{0%,9%{opacity:1}9.40%,48.56%{opacity:0}48.91%,100%{opacity:1}}
    @keyframes r15{0%,9%{opacity:1}9.40%,50.42%{opacity:0}50.77%,100%{opacity:1}}
    @keyframes r16{0%,9%{opacity:1}9.40%,52.28%{opacity:0}52.63%,100%{opacity:1}}
    @keyframes r17{0%,9%{opacity:1}9.40%,54.15%{opacity:0}54.50%,100%{opacity:1}}
    @keyframes r18{0%,9%{opacity:1}9.40%,56.01%{opacity:0}56.36%,100%{opacity:1}}
  </style>
  <rect class="bg" width="1160" height="471" rx="10"/>
  <rect class="chrome" width="1160" height="32" rx="10"/>
  <rect class="chrome" y="22" width="1160" height="10"/>
  <circle cx="20" cy="16" r="5" fill="#e26d6d"/>
  <circle cx="38" cy="16" r="5" fill="#d8a44b"/>
  <circle cx="56" cy="16" r="5" fill="#5fbf8a"/>
  <text class="d" x="76" y="21" style="font-size:11.5px;opacity:1;animation:none">node examples/with-plugins.mjs</text>
  <text class="l" x="22" y="73" style="animation-name:r1">  <tspan class="b">Plexus</tspan> <tspan class="d">— agents do the work, a plugin tells the team</tspan></text>
  <text class="l" x="22" y="94" style="animation-name:r2"><tspan class="d">  broker mqtt://localhost:1883   root plexus-record-mt93shyd</tspan></text>
  <text class="l" x="22" y="157" style="animation-name:r5"><tspan class="d"> 0.5s</tspan>  <tspan class="teal">alice    </tspan> invoke <tspan class="b">code.review</tspan> <tspan class="d">{ repo: acme/web-app, pr: 42 }</tspan></text>
  <text class="l" x="22" y="178" style="animation-name:r6"><tspan class="d"> 0.5s</tspan>  <tspan class="teal">reviewer </tspan> reviewing <tspan class="b">acme/web-app#42</tspan></text>
  <text class="l" x="22" y="199" style="animation-name:r7"><tspan class="d"> 0.8s</tspan>  <tspan class="teal">reviewer </tspan> found a migration — delegating that part</text>
  <text class="l" x="22" y="220" style="animation-name:r8"><tspan class="d"> 0.8s</tspan>  <tspan class="teal">dba      </tspan> reviewing <tspan class="b">0042_add_users_index.sql</tspan></text>
  <text class="l" x="22" y="241" style="animation-name:r9"><tspan class="d"> 1.2s</tspan>  <tspan class="amber">notify   </tspan> <tspan class="b">Risky migration flagged by dba</tspan></text>
  <text class="l" x="22" y="262" style="animation-name:r10"><tspan class="d">         ALTER on users without CONCURRENTLY — locks writes for the whole rebuild</tspan></text>
  <text class="l" x="22" y="283" style="animation-name:r11"><tspan class="d"> 1.2s</tspan>  <tspan class="amber">notify   </tspan> <tspan class="b">Changes requested on acme/web-app#42</tspan></text>
  <text class="l" x="22" y="304" style="animation-name:r12"><tspan class="d">         Application logic is fine. Blocking on the migration: ALTER on users without CONCURRENTLY — locks writes for the whole rebuild</tspan></text>
  <text class="l" x="22" y="325" style="animation-name:r13"><tspan class="d">         reviewed for alice · job job-b471efb612b3</tspan></text>
  <text class="l" x="22" y="367" style="animation-name:r15"><tspan class="d"> 1.7s</tspan>  <tspan class="teal">alice    </tspan> <tspan class="b">← REQUEST_CHANGES</tspan></text>
  <text class="l" x="22" y="409" style="animation-name:r17">  <tspan class="d">Two agents did the work. A plugin told the team. Neither knows the other exists.</tspan></text>
</svg>
